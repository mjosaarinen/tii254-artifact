[package]
name = "holdout-supplier-worker"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = { version = "1.10", optional = true }

[features]
default = []
block64 = ["dep:rayon"]

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true
